[package]
name = "devtree"
version = "0.1.0"
description = "Desktop codebase dependency graph and architecture validation"
authors = ["DevTree contributors"]
license = "MIT"
repository = "https://github.com/Naughty-Otters/DevTree"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "devtree_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
dirs = "6"
devtree-core = { path = "../crates/devtree-core" }
lsp-types = { version = "0.97", features = ["default"] }
url = "2.5.8"
rig-core = "0.41"
rig-agent = "0.41"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "process", "io-util"] }
futures = "0.3.33"
reqwest = { version = "0.12", features = ["json"] }
regex = "1.13.1"
notify = "6"
cron = "0.15"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

