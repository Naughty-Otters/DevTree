<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DevTree</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <div id="app">
      <header id="toolbar">
        <div class="toolbar-left">
          <button id="btn-open-project" class="btn btn-icon btn-ghost" title="Open project folder"></button>
          <button id="btn-run-analysis" class="btn btn-icon btn-ghost" disabled title="Run analysis"></button>
          <button id="btn-focus-view" class="btn btn-icon btn-ghost" disabled title="Focus view"></button>
          <button id="btn-save-file" class="btn btn-icon btn-ghost" disabled title="Save file"></button>
          <button id="btn-settings" class="btn btn-icon btn-ghost" title="Settings"></button>
        </div>
        <span id="app-title">DevTree</span>
        <span id="project-path" class="project-path">No project open</span>
      </header>

      <div id="workspace">
        <div id="main-row">
          <aside id="left-panel">
            <section id="left-tree-section" class="panel-section">
              <h3 class="panel-title">Project Tree</h3>
              <div id="project-tree" class="panel-body scrollable"></div>
            </section>
            <div class="resize-handle resize-handle-split" data-resize="left-split" data-tooltip="Resize tree / modules split"></div>
            <section id="left-modules-section" class="panel-section">
              <h3 class="panel-title">Modules <span class="panel-hint">click details · double-click drill in</span></h3>
              <div id="modules-list" class="panel-body scrollable"></div>
            </section>
          </aside>

          <div class="resize-handle resize-handle-col" data-resize="left" data-tooltip="Resize left sidebar"></div>

          <main id="center-panel">
            <div id="view-tabs">
              <button class="view-tab active" data-view="graph">Graph</button>
              <button class="view-tab" data-view="file">File</button>
            </div>
            <div id="graph-nav" class="graph-nav"></div>
            <div id="center-content">
              <canvas id="graph-canvas"></canvas>
              <div id="file-viewer" class="hidden"></div>
              <div id="graph-overlay" class="graph-overlay hidden">
                <span id="graph-overlay-text"></span>
              </div>
            </div>
          </main>
        </div>

        <div class="resize-handle resize-handle-row" data-resize="bottom" data-tooltip="Resize results panel"></div>

        <footer id="bottom-panel">
          <div id="results-panel"></div>
        </footer>
      </div>

      <div id="settings-overlay" class="hidden" aria-hidden="true">
        <div class="settings-backdrop"></div>
        <aside id="settings-panel" role="dialog" aria-modal="true" aria-labelledby="settings-title">
          <header class="settings-header">
            <h2 id="settings-title">Settings</h2>
            <button id="btn-close-settings" class="btn btn-icon btn-ghost" title="Close settings"></button>
          </header>
          <div class="settings-body settings-accordion">
            <section class="settings-accordion-item is-open" data-settings-section="rules">
              <button type="button" class="settings-accordion-trigger" aria-expanded="true">
                <span>Analysis Rules</span>
                <span class="settings-accordion-chevron" aria-hidden="true"></span>
              </button>
              <div class="settings-accordion-panel">
                <div id="rules-panel" class="panel-body scrollable"></div>
              </div>
            </section>
            <section class="settings-accordion-item" data-settings-section="linters">
              <button type="button" class="settings-accordion-trigger" aria-expanded="false">
                <span>Language Linters</span>
                <span class="settings-accordion-chevron" aria-hidden="true"></span>
              </button>
              <div class="settings-accordion-panel">
                <div id="linters-panel" class="panel-body scrollable"></div>
              </div>
            </section>
            <section class="settings-accordion-item" data-settings-section="lsp">
              <button type="button" class="settings-accordion-trigger" aria-expanded="false">
                <span>LSP Servers</span>
                <span class="settings-accordion-chevron" aria-hidden="true"></span>
              </button>
              <div class="settings-accordion-panel">
                <div id="lsp-servers-panel" class="panel-body scrollable"></div>
              </div>
            </section>
          </div>
        </aside>
      </div>
    </div>
  </body>
</html>
