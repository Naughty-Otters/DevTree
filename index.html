<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DevTree</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <div id="app">
      <header id="toolbar">
        <div class="toolbar-left">
          <button id="btn-open-project" class="btn btn-icon btn-ghost" title="Open project folder"></button>
          <button id="btn-run-analysis" class="btn btn-icon btn-ghost" disabled title="Run analysis"></button>
          <button id="btn-stop-analysis" class="btn btn-icon btn-ghost" disabled title="Stop analysis"></button>
          <button id="btn-save-file" class="btn btn-icon btn-ghost" disabled title="Save file"></button>
          <button id="btn-setup-wizard" class="btn btn-icon btn-ghost" title="Setup guide"></button>
          <button id="btn-settings" class="btn btn-icon btn-ghost" title="Settings"></button>
        </div>
        <span id="app-title">DevTree</span>
        <span id="project-path" class="project-path">No project open</span>
      </header>

      <div id="breadcrumb-bar" class="breadcrumb-bar is-empty" aria-label="Navigation"></div>

      <div id="workspace">
        <div id="main-row">
          <aside id="left-panel">
            <section id="left-tree-section" class="panel-section">
              <h3 class="panel-title">Project Tree</h3>
              <div id="project-tree" class="panel-body scrollable"></div>
            </section>
            <div class="resize-handle resize-handle-split" data-resize="left-split" data-tooltip="Resize tree / modules split"></div>
            <section id="left-modules-section" class="panel-section">
              <h3 class="panel-title">Modules <span class="panel-hint">Click = details · Double-click = drill in</span></h3>
              <div id="modules-list" class="panel-body scrollable"></div>
            </section>
          </aside>

          <div class="resize-handle resize-handle-col" data-resize="left" data-tooltip="Resize left sidebar"></div>

          <main id="center-panel">
            <div id="view-tabs">
              <button class="view-tab" data-view="report" title="Overall analysis report — health, ratings, and key findings">Report</button>
              <button class="view-tab" data-view="progress" title="Live analysis progress and AI stream output">Progress</button>
              <button class="view-tab active" data-view="graph" title="Dependency graph — packages and modules">Graph</button>
              <button class="view-tab" data-view="dsm" title="Design Structure Matrix — dependency grid and modularity health">DSM</button>
              <button class="view-tab" data-view="file" title="Source file viewer — open from the Project Tree or double-click a graph node">File</button>
            </div>
            <div id="graph-nav" class="graph-nav"></div>
            <div id="center-content">
              <div id="analysis-report-view" class="analysis-report-view hidden" aria-label="Analysis report"></div>
              <div id="analysis-progress-view" class="analysis-progress-view hidden" aria-label="Analysis progress"></div>
              <canvas id="graph-canvas"></canvas>
              <div id="dsm-view" class="hidden"></div>
              <div id="file-viewer" class="hidden"></div>
              <div id="graph-overlay" class="graph-overlay hidden" aria-live="polite"></div>
              <aside
                id="module-details-panel"
                class="module-details-panel"
                aria-hidden="true"
              ></aside>
            </div>
          </main>

          <div
            id="right-resize-handle"
            class="resize-handle resize-handle-col hidden"
            data-resize="right"
            data-tooltip="Resize settings panel"
          ></div>

          <aside id="right-panel" class="hidden" aria-hidden="true">
            <header class="settings-header">
              <h2 id="settings-title">Settings</h2>
              <div class="settings-header-actions">
                <button id="btn-setup-guide" type="button" class="btn-text" title="Open the setup wizard">Setup guide</button>
                <button id="btn-close-settings" class="btn btn-icon btn-ghost" title="Close settings"></button>
              </div>
            </header>
            <div class="settings-body settings-accordion">
              <section class="settings-accordion-item is-open" data-settings-section="rules">
                <div class="settings-accordion-header">
                  <span class="settings-accordion-label">Analysis Rules</span>
                  <button
                    type="button"
                    class="settings-accordion-expand"
                    aria-expanded="true"
                    aria-label="Expand or collapse Analysis Rules"
                  >
                    <span class="settings-accordion-chevron" aria-hidden="true"></span>
                  </button>
                </div>
                <div class="settings-accordion-panel">
                  <div id="rules-panel" class="panel-body scrollable"></div>
                </div>
              </section>
              <section class="settings-accordion-item" data-settings-section="linters">
                <div class="settings-accordion-header">
                  <span class="settings-accordion-label">Language Linters</span>
                  <button
                    type="button"
                    class="settings-accordion-expand"
                    aria-expanded="false"
                    aria-label="Expand or collapse Language Linters"
                  >
                    <span class="settings-accordion-chevron" aria-hidden="true"></span>
                  </button>
                </div>
                <div class="settings-accordion-panel">
                  <div id="linters-panel" class="panel-body scrollable"></div>
                </div>
              </section>
              <section class="settings-accordion-item" data-settings-section="llm-configs">
                <div class="settings-accordion-header">
                  <span class="settings-accordion-label">LLM Configurations</span>
                  <button
                    type="button"
                    class="settings-accordion-expand"
                    aria-expanded="false"
                    aria-label="Expand or collapse LLM Configurations"
                  >
                    <span class="settings-accordion-chevron" aria-hidden="true"></span>
                  </button>
                </div>
                <div class="settings-accordion-panel">
                  <div id="llm-provider-configs-panel" class="panel-body scrollable"></div>
                </div>
              </section>
              <section class="settings-accordion-item" data-settings-section="llm-runtime">
                <div class="settings-accordion-header">
                  <span class="settings-accordion-label">LLM Runtime</span>
                  <button
                    type="button"
                    class="settings-accordion-expand"
                    aria-expanded="false"
                    aria-label="Expand or collapse LLM Runtime"
                  >
                    <span class="settings-accordion-chevron" aria-hidden="true"></span>
                  </button>
                </div>
                <div class="settings-accordion-panel">
                  <div id="llm-runtime-settings-panel" class="panel-body scrollable"></div>
                </div>
              </section>
              <section class="settings-accordion-item" data-settings-section="architecture">
                <div class="settings-accordion-header">
                  <span class="settings-accordion-label">Architecture / Design Rules</span>
                  <button
                    type="button"
                    class="settings-accordion-expand"
                    aria-expanded="false"
                    aria-label="Expand or collapse Architecture Design Rules"
                  >
                    <span class="settings-accordion-chevron" aria-hidden="true"></span>
                  </button>
                </div>
                <div class="settings-accordion-panel">
                  <div id="design-rules-panel" class="panel-body scrollable"></div>
                </div>
              </section>
              <section class="settings-accordion-item" data-settings-section="lsp">
                <div class="settings-accordion-header">
                  <span class="settings-accordion-label">LSP Servers</span>
                  <button
                    type="button"
                    class="settings-accordion-expand"
                    aria-expanded="false"
                    aria-label="Expand or collapse LSP Servers"
                  >
                    <span class="settings-accordion-chevron" aria-hidden="true"></span>
                  </button>
                </div>
                <div class="settings-accordion-panel">
                  <div id="lsp-servers-panel" class="panel-body scrollable"></div>
                </div>
              </section>
            </div>
          </aside>
        </div>

        <div class="resize-handle resize-handle-row" data-resize="bottom" data-tooltip="Resize results panel"></div>

        <footer id="bottom-panel">
          <div id="results-panel"></div>
        </footer>
      </div>
    </div>
  </body>
</html>
