[package]
name = "devtree-core"
version = "0.1.0"
edition = "2021"
description = "Graph layout and metrics for DevTree"
license = "MIT"
repository = "https://github.com/devtree/devtree"

[lib]
name = "devtree_core"
crate-type = ["rlib", "cdylib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = { version = "0.2", optional = true }
js-sys = { version = "0.3", optional = true }

[features]
wasm = ["dep:wasm-bindgen", "dep:js-sys"]
