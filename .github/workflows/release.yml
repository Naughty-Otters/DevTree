# Tag push *or* manual run → GitHub Release + Actions artifacts + optional npm / Homebrew
# (same distribution surface as Naughty-Otters/Teralexi).
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 0.1.0 or v0.1.0). Must match package.json."
        required: true
        type: string
      draft:
        description: "Create a draft release (recommended)"
        required: false
        type: boolean
        default: true
      prerelease:
        description: "Mark release as prerelease"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  meta:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      draft: ${{ steps.resolve.outputs.draft }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release tag
        id: resolve
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW="${{ inputs.version }}"
            DRAFT="${{ inputs.draft }}"
            PRERELEASE="${{ inputs.prerelease }}"
          else
            RAW="${{ github.ref_name }}"
            DRAFT="true"
            PRERELEASE="false"
          fi
          VERSION="${RAW#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-].*)?$ ]]; then
            echo "::error::Invalid version '$RAW' (expected semver like 0.1.0)"
            exit 1
          fi
          PKG="$(node -p "require('./package.json').version")"
          if [ "$PKG" != "$VERSION" ] && [ "$PKG" != "${VERSION%%-*}" ]; then
            echo "::warning::package.json version is $PKG but release version is $VERSION — sync with npm run sync:version before publishing npm"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "draft=$DRAFT" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "Release tag: v$VERSION (draft=$DRAFT prerelease=$PRERELEASE)"

  release:
    name: Release (${{ matrix.platform }})
    needs: meta
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            name: macOS-arm64
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            name: Windows-x64
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Rust WASM target
        run: rustup target add wasm32-unknown-unknown

      - name: Install frontend dependencies
        run: npm ci

      - name: Sync / check package versions
        run: node scripts/sync-cli-version.mjs --check

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Unsigned until Apple/Windows signing secrets are configured (see OPEN_SOURCE.md).
          APPLE_SIGNING_IDENTITY: "-"
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        with:
          tagName: ${{ needs.meta.outputs.tag }}
          releaseName: DevTree ${{ needs.meta.outputs.tag }}
          releaseBody: |
            Download DevTree for your platform from the assets below.

            **Install options**
            - **GitHub Releases** — DMG / Windows installer (this page)
            - **npm CLI** — `npm i -g devtree-ai@latest` then `devtree install && devtree open`
            - **Homebrew (macOS)** — `brew tap Naughty-Otters/tap && brew install --cask devtree`

            **macOS (Apple Silicon)** — `aarch64` build from `macos-latest`
            **Windows** — `x86_64-pc-windows-msvc` installer

            > **Note:** Builds are currently unsigned. macOS may require right-click → Open on first launch.
          releaseDraft: ${{ needs.meta.outputs.draft == 'true' }}
          prerelease: ${{ needs.meta.outputs.prerelease == 'true' }}
          args: --target ${{ matrix.target }} --no-sign

      # Also keep installers on the workflow run (Actions Artifacts), not only GitHub Releases.
      - name: Upload macOS build artifacts
        if: matrix.platform == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: DevTree-${{ needs.meta.outputs.tag }}-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/**
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/**
          if-no-files-found: warn
          retention-days: 90

      - name: List Windows bundle outputs
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          echo "=== Windows bundle tree ==="
          find src-tauri/target -type d \( -name msi -o -name nsis -o -name bundle \) 2>/dev/null | head -40
          find src-tauri/target -type f \( -name '*.msi' -o -name '*.exe' -o -name '*.zip' \) 2>/dev/null | head -80 || true

      - name: Upload Windows build artifacts
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: DevTree-${{ needs.meta.outputs.tag }}-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/**
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/**
            src-tauri/target/release/bundle/msi/**
            src-tauri/target/release/bundle/nsis/**
          if-no-files-found: warn
          retention-days: 90

      - name: List macOS bundle outputs
        if: matrix.platform == 'macos-latest'
        run: |
          echo "=== bundle tree ==="
          find src-tauri/target -type d -name bundle 2>/dev/null | while read -r d; do
            echo "-- $d"
            find "$d" -maxdepth 3 -type f \( -name '*.dmg' -o -name '*.tar.gz' -o -name '*.sig' \) -print 2>/dev/null || true
          done

      - name: Update Homebrew cask sha256 (from installer)
        if: matrix.platform == 'macos-latest'
        run: |
          node scripts/update-homebrew-cask.mjs \
            --search-root src-tauri/target \
            --bundle-dir "src-tauri/target/${{ matrix.target }}/release/bundle" \
            --allow-missing
          mkdir -p packaging-out
          if [ -f packaging/homebrew/devtree-cask-checksums.json ]; then
            cp packaging/homebrew/devtree.rb packaging-out/
            cp packaging/homebrew/devtree-cask-checksums.json packaging-out/
          else
            echo "No installer found for Homebrew cask; uploading placeholder note."
            echo "DMG/.app.tar.gz missing from this macOS build." > packaging-out/README.txt
          fi

      - name: Upload Homebrew cask packaging artifact
        if: matrix.platform == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: devtree-homebrew-cask
          path: packaging-out/
          retention-days: 14
          if-no-files-found: error

  npm-publish-cli:
    name: Publish devtree-ai to npm
    needs: [meta, release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Sync version, test, publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          node scripts/sync-cli-version.mjs
          npm --prefix packages/cli test
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "::warning::NPM_TOKEN not set — skipping npm publish for devtree-ai"
            (cd packages/cli && npm pack --dry-run)
            exit 0
          fi
          cd packages/cli
          npm publish --access public

  homebrew-tap:
    name: Update Homebrew tap cask
    needs: [meta, release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: devtree-homebrew-cask
          path: packaging-out

      - name: Push Casks/devtree.rb to Naughty-Otters/homebrew-tap
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          RELEASE_TAG: ${{ needs.meta.outputs.tag }}
        run: |
          set -euo pipefail
          if [ ! -f packaging-out/devtree.rb ]; then
            echo "::warning::No Homebrew cask Ruby file in packaging artifact — skipping tap update"
            ls -la packaging-out || true
            exit 0
          fi
          if [ -z "${HOMEBREW_TAP_TOKEN}" ]; then
            echo "::warning::HOMEBREW_TAP_TOKEN not set — skipping tap update (cask artifact still uploaded)"
            ls -la packaging-out
            exit 0
          fi
          git clone --depth 1 "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/Naughty-Otters/homebrew-tap.git" tap
          mkdir -p tap/Casks
          cp packaging-out/devtree.rb tap/Casks/devtree.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/devtree.rb
          if git diff --staged --quiet; then
            echo "Homebrew tap already up to date."
            exit 0
          fi
          git commit -m "chore: update devtree cask to ${RELEASE_TAG}"
          git push
