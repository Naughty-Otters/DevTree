# Tag push → GitHub Release only (users download installers from the Releases page).
# No App Store, Homebrew, crates.io, or other external publish targets.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Release (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            name: macOS-arm64
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            name: Windows-x64
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Rust WASM target
        run: rustup target add wasm32-unknown-unknown

      - name: Install frontend dependencies
        run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Unsigned until Apple/Windows signing secrets are configured (see OPEN_SOURCE.md).
          APPLE_SIGNING_IDENTITY: "-"
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        with:
          tagName: ${{ github.ref_name }}
          releaseName: DevTree ${{ github.ref_name }}
          releaseBody: |
            Download DevTree for your platform from the assets below (GitHub Releases only).

            **macOS (Apple Silicon)** — `aarch64` build from `macos-latest`
            **Windows** — `x86_64-pc-windows-msvc` installer

            > **Note:** Builds are currently unsigned. macOS may require right-click → Open on first launch.
          # Draft until reviewed; publish the draft on GitHub so users can download.
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }} --no-sign
