# Tag push *or* manual run → GitHub Release + Actions artifacts + optional npm / Homebrew
# (same distribution surface as Naughty-Otters/Teralexi).
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 0.1.0 or v0.1.0). Must match package.json."
        required: true
        type: string
      draft:
        description: "Create a draft release (recommended)"
        required: false
        type: boolean
        default: true
      prerelease:
        description: "Mark release as prerelease"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  meta:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      draft: ${{ steps.resolve.outputs.draft }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release tag
        id: resolve
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW="${{ inputs.version }}"
            DRAFT="${{ inputs.draft }}"
            PRERELEASE="${{ inputs.prerelease }}"
          else
            RAW="${{ github.ref_name }}"
            DRAFT="true"
            PRERELEASE="false"
          fi
          VERSION="${RAW#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-].*)?$ ]]; then
            echo "::error::Invalid version '$RAW' (expected semver like 0.1.0)"
            exit 1
          fi
          PKG="$(tr -d '[:space:]' < VERSION | sed 's/^v//')"
          if [ -z "$PKG" ]; then
            PKG="$(node -p "require('./package.json').version")"
          fi
          if [ "$PKG" != "$VERSION" ] && [ "$PKG" != "${VERSION%%-*}" ]; then
            echo "::warning::VERSION is $PKG but release input is $VERSION — bump VERSION / npm run sync:version before publishing npm"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "draft=$DRAFT" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "Release tag: v$VERSION (draft=$DRAFT prerelease=$PRERELEASE)"

  release:
    name: Release (${{ matrix.name }})
    needs: meta
    # Signing / notarization secrets live in the "release" environment
    # (same secret names as Naughty-Otters/OpenFDE / Teralexi).
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: mac
            platform: macos-latest
            target: aarch64-apple-darwin
            name: macOS-arm64
            bundles: app,dmg
          - os: win
            platform: windows-latest
            target: x86_64-pc-windows-msvc
            name: Windows-x64
            bundles: msi,nsis
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Rust WASM target
        run: rustup target add wasm32-unknown-unknown

      - name: Install frontend dependencies
        run: npm ci

      - name: Sync / check package versions
        run: node scripts/apply-version.mjs --check

      - name: Require macOS signing secrets
        if: matrix.os == 'mac'
        env:
          MAC_SIGN_CERTIFICATE_BASE64: ${{ secrets.MAC_SIGN_CERTIFICATE_BASE64 }}
          MAC_SIGN_CERTIFICATE_PASSWORD: ${{ secrets.MAC_SIGN_CERTIFICATE_PASSWORD }}
          MAC_APPLE_ID: ${{ secrets.MAC_APPLE_ID }}
          MAC_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.MAC_APPLE_APP_SPECIFIC_PASSWORD }}
          MAC_APPLE_TEAM_ID: ${{ secrets.MAC_APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          missing=()
          for v in MAC_SIGN_CERTIFICATE_BASE64 MAC_SIGN_CERTIFICATE_PASSWORD \
                   MAC_APPLE_ID MAC_APPLE_APP_SPECIFIC_PASSWORD MAC_APPLE_TEAM_ID; do
            if [ -z "${!v}" ]; then missing+=("$v"); fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing release-environment secrets for macOS signing/notarization: ${missing[*]}"
            echo "Copy the same MAC_* secrets from OpenFDE into this repo's GitHub Environment named \"release\"."
            exit 1
          fi
          echo "macOS signing + notarization secrets present."

      # Trim + validate notarization creds (Tauri → notarytool). OpenFDE maps these to
      # APPLE_APP_SPECIFIC_PASSWORD; Tauri expects APPLE_PASSWORD.
      - name: Prepare Apple notarization credentials
        if: matrix.os == 'mac'
        env:
          RAW_APPLE_ID: ${{ secrets.MAC_APPLE_ID }}
          RAW_APPLE_PASSWORD: ${{ secrets.MAC_APPLE_APP_SPECIFIC_PASSWORD }}
          RAW_APPLE_TEAM_ID: ${{ secrets.MAC_APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          trim() {
            # strip CR/LF and leading/trailing whitespace (common when pasting secrets)
            local s="$1"
            s="${s//$'\r'/}"
            s="${s#"${s%%[![:space:]]*}"}"
            s="${s%"${s##*[![:space:]]}"}"
            printf '%s' "$s"
          }
          APPLE_ID="$(trim "$RAW_APPLE_ID")"
          APPLE_PASSWORD="$(trim "$RAW_APPLE_PASSWORD")"
          APPLE_TEAM_ID="$(trim "$RAW_APPLE_TEAM_ID")"

          if [[ ! "$APPLE_TEAM_ID" =~ ^[A-Z0-9]{10}$ ]]; then
            echo "::error::MAC_APPLE_TEAM_ID must be a 10-character Team ID (got length ${#APPLE_TEAM_ID})."
            exit 1
          fi
          # App-specific passwords are typically xxxx-xxxx-xxxx-xxxx (19 chars with dashes)
          if [[ ! "$APPLE_PASSWORD" =~ ^[a-zA-Z0-9-]{8,}$ ]]; then
            echo "::error::MAC_APPLE_APP_SPECIFIC_PASSWORD looks invalid after trim. Generate one at appleid.apple.com → App-Specific Passwords."
            exit 1
          fi

          {
            echo "APPLE_ID<<EOF"
            printf '%s\n' "$APPLE_ID"
            echo "EOF"
            echo "APPLE_PASSWORD<<EOF"
            printf '%s\n' "$APPLE_PASSWORD"
            echo "EOF"
            echo "APPLE_TEAM_ID<<EOF"
            printf '%s\n' "$APPLE_TEAM_ID"
            echo "EOF"
          } >> "$GITHUB_ENV"

          echo "APPLE_ID length=${#APPLE_ID} (domain=$(printf '%s' "$APPLE_ID" | sed 's/.*@/@/'))"
          echo "APPLE_TEAM_ID=$APPLE_TEAM_ID"
          echo "APPLE_PASSWORD length=${#APPLE_PASSWORD} (value not printed)"

          echo "Verifying notarization credentials with notarytool…"
          if ! xcrun notarytool history \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" \
              --output-format json >/tmp/notary-history.json 2>/tmp/notary-history.err; then
            echo "::error::Apple notarization auth failed (HTTP 401 / invalid credentials)."
            echo "Fix MAC_APPLE_* in the DevTree GitHub Environment \"release\":"
            echo "  1. MAC_APPLE_ID = Apple ID email that owns the Developer team"
            echo "  2. MAC_APPLE_APP_SPECIFIC_PASSWORD = NEW app-specific password from https://appleid.apple.com"
            echo "     (Sign-In and Security → App-Specific Passwords). NOT your Apple ID login password."
            echo "  3. MAC_APPLE_TEAM_ID = 10-char Team ID from developer.apple.com → Membership"
            echo "  4. Re-copy from OpenFDE's release env if that release still notarizes successfully."
            echo "--- notarytool stderr ---"
            cat /tmp/notary-history.err || true
            exit 1
          fi
          echo "notarytool credentials OK."

      # Tauri requires APPLE_SIGNING_IDENTITY to exactly match the cert in APPLE_CERTIFICATE.
      # OpenFDE's MAC_SIGN_IDENTITY is often the short CSC_NAME form — resolve from the .p12.
      # Do NOT change the user keychain search list (that breaks subsequent Tauri import).
      - name: Resolve Apple signing identity from certificate
        if: matrix.os == 'mac'
        env:
          APPLE_CERTIFICATE: ${{ secrets.MAC_SIGN_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.MAC_SIGN_CERTIFICATE_PASSWORD }}
          MAC_SIGN_IDENTITY: ${{ secrets.MAC_SIGN_IDENTITY }}
        run: |
          set -euo pipefail
          CERT_PATH="${RUNNER_TEMP}/devtree-signing.p12"
          KEYCHAIN_PATH="${RUNNER_TEMP}/devtree-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          echo -n "$APPLE_CERTIFICATE" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
          IDENTITY="$(
            security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
              | grep -F 'Developer ID Application' \
              | head -n 1 \
              | sed -E 's/^[[:space:]]*[0-9]+\) [A-F0-9]+ "(.+)"$/\1/'
          )"
          if [ -z "$IDENTITY" ]; then
            echo "::error::No Developer ID Application identity found in MAC_SIGN_CERTIFICATE_BASE64"
            exit 1
          fi
          echo "Resolved APPLE_SIGNING_IDENTITY=$IDENTITY"
          if [ -n "${MAC_SIGN_IDENTITY:-}" ] && [ "$MAC_SIGN_IDENTITY" != "$IDENTITY" ]; then
            echo "::warning::MAC_SIGN_IDENTITY ('$MAC_SIGN_IDENTITY') does not match cert identity; using cert identity for Tauri."
          fi
          CERT_TEAM="$(printf '%s' "$IDENTITY" | sed -E 's/.*\(([A-Z0-9]{10})\)$/\1/')"
          if [ -n "${APPLE_TEAM_ID:-}" ] && [ "$CERT_TEAM" != "$IDENTITY" ] && [ "$CERT_TEAM" != "$APPLE_TEAM_ID" ]; then
            echo "::error::MAC_APPLE_TEAM_ID ($APPLE_TEAM_ID) does not match Team ID in signing cert ($CERT_TEAM)."
            echo "Notarization must use the same team that owns Developer ID Application."
            exit 1
          fi
          # Heredoc: identity contains spaces and ':' which break KEY=value GITHUB_ENV lines.
          {
            echo "APPLE_SIGNING_IDENTITY<<EOF"
            printf '%s\n' "$IDENTITY"
            echo "EOF"
          } >> "$GITHUB_ENV"
          rm -f "$CERT_PATH"
          security delete-keychain "$KEYCHAIN_PATH" || true

      # Windows — same OpenFDE secrets: Azure Trusted Signing preferred, else WIN_SIGN_* .pfx
      - name: Require Windows signing secrets
        if: matrix.os == 'win'
        env:
          WIN_SIGN_CERTIFICATE_BASE64: ${{ secrets.WIN_SIGN_CERTIFICATE_BASE64 }}
          WIN_SIGN_CERTIFICATE_PASSWORD: ${{ secrets.WIN_SIGN_CERTIFICATE_PASSWORD }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_SIGNING_ACCOUNT_NAME }}
          AZURE_SIGNING_CERTIFICATE_PROFILE: ${{ secrets.AZURE_SIGNING_CERTIFICATE_PROFILE }}
          AZURE_SIGNING_PUBLISHER_NAME: ${{ secrets.AZURE_SIGNING_PUBLISHER_NAME }}
        shell: bash
        run: |
          set -euo pipefail
          azure_ok=1
          for v in AZURE_TENANT_ID AZURE_CLIENT_ID AZURE_CLIENT_SECRET \
                   AZURE_SIGNING_ENDPOINT AZURE_SIGNING_ACCOUNT_NAME \
                   AZURE_SIGNING_CERTIFICATE_PROFILE AZURE_SIGNING_PUBLISHER_NAME; do
            if [ -z "${!v}" ]; then azure_ok=0; fi
          done
          pfx_ok=0
          if [ -n "${WIN_SIGN_CERTIFICATE_BASE64}" ] && [ -n "${WIN_SIGN_CERTIFICATE_PASSWORD}" ]; then
            pfx_ok=1
          fi
          if [ "$azure_ok" -eq 1 ]; then
            echo "Windows Azure Trusted Signing secrets present (preferred)."
            echo "WINDOWS_SIGN_MODE=azure" >> "$GITHUB_ENV"
          elif [ "$pfx_ok" -eq 1 ]; then
            echo "Windows WIN_SIGN_* .pfx secrets present."
            echo "WINDOWS_SIGN_MODE=pfx" >> "$GITHUB_ENV"
          else
            echo "::error::Missing Windows signing secrets. Need all seven AZURE_* vars (preferred) or WIN_SIGN_CERTIFICATE_BASE64 + WIN_SIGN_CERTIFICATE_PASSWORD."
            echo "Copy the same WIN_SIGN_* / AZURE_* secrets from OpenFDE into this repo's GitHub Environment named \"release\"."
            exit 1
          fi

      - name: Setup .NET (Windows Azure signing)
        if: matrix.os == 'win' && env.WINDOWS_SIGN_MODE == 'azure'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      # Tauri splits string signCommand on spaces; paths/spaces need object form with literal "%1".
      - name: Configure Windows Azure Trusted Signing
        if: matrix.os == 'win' && env.WINDOWS_SIGN_MODE == 'azure'
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_SIGNING_ACCOUNT_NAME }}
          AZURE_SIGNING_CERTIFICATE_PROFILE: ${{ secrets.AZURE_SIGNING_CERTIFICATE_PROFILE }}
          AZURE_SIGNING_PUBLISHER_NAME: ${{ secrets.AZURE_SIGNING_PUBLISHER_NAME }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet tool update -g --prerelease sign
          if ($LASTEXITCODE -ne 0) {
            dotnet tool install -g --prerelease sign
          }
          $signPath = Join-Path $env:USERPROFILE '.dotnet\tools'
          echo "$signPath" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $env:Path = "$signPath;$env:Path"

          $scriptPath = Join-Path $env:GITHUB_WORKSPACE 'scripts\sign-windows.ps1'
          if (-not (Test-Path -LiteralPath $scriptPath)) {
            throw "Missing $scriptPath"
          }

          # Object-form signCommand: Tauri replaces the literal "%1" arg with the file path.
          # String form splits on spaces and breaks -File paths / quoted %1.
          $env:SIGN_SCRIPT = $scriptPath
          node -e @"
          const fs = require('fs');
          const path = 'src-tauri/tauri.conf.json';
          const conf = JSON.parse(fs.readFileSync(path, 'utf8'));
          conf.bundle = conf.bundle || {};
          conf.bundle.windows = {
            ...(conf.bundle.windows || {}),
            signCommand: {
              cmd: 'powershell.exe',
              args: [
                '-NoProfile',
                '-ExecutionPolicy',
                'Bypass',
                '-File',
                process.env.SIGN_SCRIPT,
                '%1',
              ],
            },
          };
          delete conf.bundle.windows.certificateThumbprint;
          fs.writeFileSync(path, JSON.stringify(conf, null, 2) + '\n');
          console.log('Wrote windows.signCommand object form');
          console.log(JSON.stringify(conf.bundle.windows.signCommand, null, 2));
          "@

          $signExe = (Get-Command sign).Source
          Write-Host "sign tool: $signExe"
          & $signExe --version

          # Fail fast: sign a probe PE before the long Tauri build.
          $probe = Join-Path $env:RUNNER_TEMP 'devtree-sign-probe.exe'
          Copy-Item -LiteralPath "$env:SystemRoot\System32\cmd.exe" -Destination $probe -Force
          Write-Host "Azure signing preflight on $probe …"
          & $scriptPath $probe
          Write-Host "Azure signing preflight OK."

      - name: Import Windows signing certificate (.pfx)
        if: matrix.os == 'win' && env.WINDOWS_SIGN_MODE == 'pfx'
        env:
          WIN_SIGN_CERTIFICATE: ${{ secrets.WIN_SIGN_CERTIFICATE_BASE64 }}
          WIN_SIGN_CERTIFICATE_PASSWORD: ${{ secrets.WIN_SIGN_CERTIFICATE_PASSWORD }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path certificate | Out-Null
          $bytes = [Convert]::FromBase64String($env:WIN_SIGN_CERTIFICATE)
          [IO.File]::WriteAllBytes("$pwd/certificate/certificate.pfx", $bytes)
          $secure = ConvertTo-SecureString -String $env:WIN_SIGN_CERTIFICATE_PASSWORD -Force -AsPlainText
          $cert = Import-PfxCertificate `
            -FilePath "$pwd/certificate/certificate.pfx" `
            -CertStoreLocation Cert:\CurrentUser\My `
            -Password $secure
          $thumb = $cert.Thumbprint
          Write-Host "Imported certificate thumbprint=$thumb"
          $env:THUMB = $thumb
          node -e @'
          const fs = require("fs");
          const path = "src-tauri/tauri.conf.json";
          const conf = JSON.parse(fs.readFileSync(path, "utf8"));
          conf.bundle = conf.bundle || {};
          conf.bundle.windows = {
            ...(conf.bundle.windows || {}),
            certificateThumbprint: process.env.THUMB,
            digestAlgorithm: "sha256",
            timestampUrl: "http://timestamp.digicert.com",
          };
          delete conf.bundle.windows.signCommand;
          fs.writeFileSync(path, JSON.stringify(conf, null, 2) + "\n");
          console.log("Wrote windows.certificateThumbprint=" + process.env.THUMB);
          '@

      - name: Build + upload to GitHub Release
        id: tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI: true
          # macOS — OpenFDE secret names → Tauri APPLE_* env
          # APPLE_SIGNING_IDENTITY comes from the cert (see Resolve step), not MAC_SIGN_IDENTITY
          # APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID come from Prepare step (trimmed)
          APPLE_CERTIFICATE: ${{ matrix.os == 'mac' && secrets.MAC_SIGN_CERTIFICATE_BASE64 || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ matrix.os == 'mac' && secrets.MAC_SIGN_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ matrix.os == 'mac' && env.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_ID: ${{ matrix.os == 'mac' && env.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ matrix.os == 'mac' && env.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ matrix.os == 'mac' && env.APPLE_TEAM_ID || '' }}
          # Windows — same OpenFDE AZURE_* / WIN_SIGN_* names (sign-windows.ps1 reads AZURE_*)
          WIN_SIGN_CERTIFICATE: ${{ matrix.os == 'win' && secrets.WIN_SIGN_CERTIFICATE_BASE64 || '' }}
          WIN_SIGN_CERTIFICATE_PASSWORD: ${{ matrix.os == 'win' && secrets.WIN_SIGN_CERTIFICATE_PASSWORD || '' }}
          AZURE_TENANT_ID: ${{ matrix.os == 'win' && secrets.AZURE_TENANT_ID || '' }}
          AZURE_CLIENT_ID: ${{ matrix.os == 'win' && secrets.AZURE_CLIENT_ID || '' }}
          AZURE_CLIENT_SECRET: ${{ matrix.os == 'win' && secrets.AZURE_CLIENT_SECRET || '' }}
          AZURE_SIGNING_ENDPOINT: ${{ matrix.os == 'win' && secrets.AZURE_SIGNING_ENDPOINT || '' }}
          AZURE_SIGNING_ACCOUNT_NAME: ${{ matrix.os == 'win' && secrets.AZURE_SIGNING_ACCOUNT_NAME || '' }}
          AZURE_SIGNING_CERTIFICATE_PROFILE: ${{ matrix.os == 'win' && secrets.AZURE_SIGNING_CERTIFICATE_PROFILE || '' }}
          AZURE_SIGNING_PUBLISHER_NAME: ${{ matrix.os == 'win' && secrets.AZURE_SIGNING_PUBLISHER_NAME || '' }}
        with:
          tagName: ${{ needs.meta.outputs.tag }}
          releaseName: DevTree ${{ needs.meta.outputs.tag }}
          releaseBody: |
            Download DevTree for your platform from the assets below.

            **Install options**
            - **GitHub Releases** — DMG / Windows installer (this page)
            - **npm CLI** — `npm i -g devtree-ai@latest` then `devtree install && devtree open`
            - **Homebrew (macOS)** — `brew tap Naughty-Otters/tap && brew install --cask devtree`

            **macOS (Apple Silicon)** — signed + notarized `aarch64` build
            **Windows** — signed `x86_64` installer (Azure Trusted Signing or `WIN_SIGN_*`)
          releaseDraft: ${{ needs.meta.outputs.draft == 'true' }}
          prerelease: ${{ needs.meta.outputs.prerelease == 'true' }}
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - name: Collect installers for Actions artifacts
        shell: bash
        env:
          ARTIFACT_PATHS: ${{ steps.tauri.outputs.artifactPaths }}
        run: |
          echo "tauri-action artifactPaths=$ARTIFACT_PATHS"
          node scripts/collect-release-artifacts.mjs
          ls -la release-artifacts || true

      - name: Upload build artifacts to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: DevTree-${{ needs.meta.outputs.tag }}-${{ matrix.target }}
          path: release-artifacts/
          if-no-files-found: warn
          retention-days: 90

      - name: Update Homebrew cask sha256 (from installer)
        if: matrix.platform == 'macos-latest'
        run: |
          node scripts/update-homebrew-cask.mjs \
            --search-root src-tauri/target \
            --allow-missing
          mkdir -p packaging-out
          if [ -f packaging/homebrew/devtree-cask-checksums.json ]; then
            cp packaging/homebrew/devtree.rb packaging-out/
            cp packaging/homebrew/devtree-cask-checksums.json packaging-out/
          else
            echo "No installer found for Homebrew cask; uploading placeholder note."
            echo "DMG/.app.tar.gz missing from this macOS build." > packaging-out/README.txt
          fi

      - name: Upload Homebrew cask packaging artifact
        if: matrix.platform == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: devtree-homebrew-cask
          path: packaging-out/
          retention-days: 14
          if-no-files-found: error

  npm-publish-cli:
    name: Publish devtree-ai to npm
    needs: [meta, release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Sync version, test, publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          node scripts/apply-version.mjs
          npm --prefix packages/cli test
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "::warning::NPM_TOKEN not set — skipping npm publish for devtree-ai"
            (cd packages/cli && npm pack --dry-run)
            exit 0
          fi
          set +e
          node scripts/assert-cli-version-publishable.mjs
          assert_status=$?
          set -e
          if [ "$assert_status" -eq 2 ]; then
            echo "::warning::devtree-ai@version already on npm — skipping publish"
            exit 0
          fi
          if [ "$assert_status" -ne 0 ]; then
            exit "$assert_status"
          fi
          # Apply/assert already ran from the repo root. Skip package lifecycle hooks
          # so prepublishOnly cannot fail due to cwd when publishing from packages/cli.
          npm publish --access public --ignore-scripts --prefix packages/cli

  homebrew-tap:
    name: Update Homebrew tap cask
    needs: [meta, release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: devtree-homebrew-cask
          path: packaging-out

      - name: Push Casks/devtree.rb to Naughty-Otters/homebrew-tap
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          RELEASE_TAG: ${{ needs.meta.outputs.tag }}
        run: |
          set -euo pipefail
          if [ ! -f packaging-out/devtree.rb ]; then
            echo "::warning::No Homebrew cask Ruby file in packaging artifact — skipping tap update"
            ls -la packaging-out || true
            exit 0
          fi
          if [ -z "${HOMEBREW_TAP_TOKEN}" ]; then
            echo "::warning::HOMEBREW_TAP_TOKEN not set — skipping tap update (cask artifact still uploaded)"
            ls -la packaging-out
            exit 0
          fi
          git clone --depth 1 "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/Naughty-Otters/homebrew-tap.git" tap
          mkdir -p tap/Casks
          cp packaging-out/devtree.rb tap/Casks/devtree.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/devtree.rb
          if git diff --staged --quiet; then
            echo "Homebrew tap already up to date."
            exit 0
          fi
          git commit -m "chore: update devtree cask to ${RELEASE_TAG}"
          git push
