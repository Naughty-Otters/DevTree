# Tag push *or* manual run → GitHub Release + Actions artifacts + optional npm / Homebrew
# (same distribution surface as Naughty-Otters/Teralexi).
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 0.1.0 or v0.1.0). Must match package.json."
        required: true
        type: string
      draft:
        description: "Create a draft release (recommended)"
        required: false
        type: boolean
        default: true
      prerelease:
        description: "Mark release as prerelease"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  meta:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      draft: ${{ steps.resolve.outputs.draft }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release tag
        id: resolve
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW="${{ inputs.version }}"
            DRAFT="${{ inputs.draft }}"
            PRERELEASE="${{ inputs.prerelease }}"
          else
            RAW="${{ github.ref_name }}"
            DRAFT="true"
            PRERELEASE="false"
          fi
          VERSION="${RAW#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-].*)?$ ]]; then
            echo "::error::Invalid version '$RAW' (expected semver like 0.1.0)"
            exit 1
          fi
          PKG="$(node -p "require('./package.json').version")"
          if [ "$PKG" != "$VERSION" ] && [ "$PKG" != "${VERSION%%-*}" ]; then
            echo "::warning::package.json version is $PKG but release version is $VERSION — sync with npm run sync:version before publishing npm"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "draft=$DRAFT" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "Release tag: v$VERSION (draft=$DRAFT prerelease=$PRERELEASE)"

  release:
    name: Release (${{ matrix.name }})
    needs: meta
    # Signing / notarization secrets live in the "release" environment
    # (same secret names as Naughty-Otters/OpenFDE / Teralexi).
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: mac
            platform: macos-latest
            target: aarch64-apple-darwin
            name: macOS-arm64
            bundles: app,dmg
          - os: win
            platform: windows-latest
            target: x86_64-pc-windows-msvc
            name: Windows-x64
            bundles: msi,nsis
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Rust WASM target
        run: rustup target add wasm32-unknown-unknown

      - name: Install frontend dependencies
        run: npm ci

      - name: Sync / check package versions
        run: node scripts/sync-cli-version.mjs --check

      - name: Require macOS signing secrets
        if: matrix.os == 'mac'
        env:
          MAC_SIGN_CERTIFICATE_BASE64: ${{ secrets.MAC_SIGN_CERTIFICATE_BASE64 }}
          MAC_SIGN_CERTIFICATE_PASSWORD: ${{ secrets.MAC_SIGN_CERTIFICATE_PASSWORD }}
          MAC_APPLE_ID: ${{ secrets.MAC_APPLE_ID }}
          MAC_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.MAC_APPLE_APP_SPECIFIC_PASSWORD }}
          MAC_APPLE_TEAM_ID: ${{ secrets.MAC_APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          missing=()
          for v in MAC_SIGN_CERTIFICATE_BASE64 MAC_SIGN_CERTIFICATE_PASSWORD \
                   MAC_APPLE_ID MAC_APPLE_APP_SPECIFIC_PASSWORD MAC_APPLE_TEAM_ID; do
            if [ -z "${!v}" ]; then missing+=("$v"); fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing release-environment secrets for macOS signing/notarization: ${missing[*]}"
            echo "Copy the same MAC_* secrets from OpenFDE into this repo's GitHub Environment named \"release\"."
            exit 1
          fi
          echo "macOS signing + notarization secrets present."

      # Tauri requires APPLE_SIGNING_IDENTITY to exactly match the cert in APPLE_CERTIFICATE.
      # OpenFDE's MAC_SIGN_IDENTITY is often the short CSC_NAME form (e.g. "Name (TEAMID)"),
      # which does not match — so resolve the full identity from the .p12 instead.
      - name: Resolve Apple signing identity from certificate
        if: matrix.os == 'mac'
        env:
          APPLE_CERTIFICATE: ${{ secrets.MAC_SIGN_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.MAC_SIGN_CERTIFICATE_PASSWORD }}
          MAC_SIGN_IDENTITY: ${{ secrets.MAC_SIGN_IDENTITY }}
        run: |
          set -euo pipefail
          CERT_PATH="${RUNNER_TEMP}/devtree-signing.p12"
          KEYCHAIN_PATH="${RUNNER_TEMP}/devtree-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          echo -n "$APPLE_CERTIFICATE" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed -e s/\"//g)
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
          IDENTITY="$(
            security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
              | grep -F 'Developer ID Application' \
              | head -n 1 \
              | sed -E 's/^[[:space:]]*[0-9]+\) [A-F0-9]+ "(.+)"$/\1/'
          )"
          if [ -z "$IDENTITY" ]; then
            echo "::error::No Developer ID Application identity found in MAC_SIGN_CERTIFICATE_BASE64"
            exit 1
          fi
          echo "Resolved APPLE_SIGNING_IDENTITY=$IDENTITY"
          if [ -n "${MAC_SIGN_IDENTITY}" ] && [ "$MAC_SIGN_IDENTITY" != "$IDENTITY" ]; then
            echo "::warning::MAC_SIGN_IDENTITY ('$MAC_SIGN_IDENTITY') does not match cert identity; using cert identity for Tauri."
          fi
          echo "APPLE_SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          rm -f "$CERT_PATH"
          security delete-keychain "$KEYCHAIN_PATH" || true

      # Windows — same OpenFDE secrets: Azure Trusted Signing preferred, else WIN_SIGN_* .pfx
      - name: Require Windows signing secrets
        if: matrix.os == 'win'
        env:
          WIN_SIGN_CERTIFICATE_BASE64: ${{ secrets.WIN_SIGN_CERTIFICATE_BASE64 }}
          WIN_SIGN_CERTIFICATE_PASSWORD: ${{ secrets.WIN_SIGN_CERTIFICATE_PASSWORD }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_SIGNING_ACCOUNT_NAME }}
          AZURE_SIGNING_CERTIFICATE_PROFILE: ${{ secrets.AZURE_SIGNING_CERTIFICATE_PROFILE }}
          AZURE_SIGNING_PUBLISHER_NAME: ${{ secrets.AZURE_SIGNING_PUBLISHER_NAME }}
        shell: bash
        run: |
          set -euo pipefail
          azure_ok=1
          for v in AZURE_TENANT_ID AZURE_CLIENT_ID AZURE_CLIENT_SECRET \
                   AZURE_SIGNING_ENDPOINT AZURE_SIGNING_ACCOUNT_NAME \
                   AZURE_SIGNING_CERTIFICATE_PROFILE AZURE_SIGNING_PUBLISHER_NAME; do
            if [ -z "${!v}" ]; then azure_ok=0; fi
          done
          pfx_ok=0
          if [ -n "${WIN_SIGN_CERTIFICATE_BASE64}" ] && [ -n "${WIN_SIGN_CERTIFICATE_PASSWORD}" ]; then
            pfx_ok=1
          fi
          if [ "$azure_ok" -eq 1 ]; then
            echo "Windows Azure Trusted Signing secrets present (preferred)."
            echo "WINDOWS_SIGN_MODE=azure" >> "$GITHUB_ENV"
          elif [ "$pfx_ok" -eq 1 ]; then
            echo "Windows WIN_SIGN_* .pfx secrets present."
            echo "WINDOWS_SIGN_MODE=pfx" >> "$GITHUB_ENV"
          else
            echo "::error::Missing Windows signing secrets. Need all seven AZURE_* vars (preferred) or WIN_SIGN_CERTIFICATE_BASE64 + WIN_SIGN_CERTIFICATE_PASSWORD."
            echo "Copy the same WIN_SIGN_* / AZURE_* secrets from OpenFDE into this repo's GitHub Environment named \"release\"."
            exit 1
          fi

      - name: Configure Windows Azure Trusted Signing
        if: matrix.os == 'win' && env.WINDOWS_SIGN_MODE == 'azure'
        env:
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_SIGNING_ACCOUNT_NAME }}
          AZURE_SIGNING_CERTIFICATE_PROFILE: ${{ secrets.AZURE_SIGNING_CERTIFICATE_PROFILE }}
          AZURE_SIGNING_PUBLISHER_NAME: ${{ secrets.AZURE_SIGNING_PUBLISHER_NAME }}
        shell: bash
        run: |
          set -euo pipefail
          cargo install artifact-signing-cli --locked
          node -e '
            const fs = require("fs");
            const path = "src-tauri/tauri.conf.json";
            const endpoint = (process.env.AZURE_SIGNING_ENDPOINT || "").replace(/\/$/, "");
            const account = process.env.AZURE_SIGNING_ACCOUNT_NAME;
            const profile = process.env.AZURE_SIGNING_CERTIFICATE_PROFILE;
            const publisher = process.env.AZURE_SIGNING_PUBLISHER_NAME;
            const q = (s) => `"${String(s).replace(/"/g, "\\\"")}"`;
            const signCommand = [
              "artifact-signing-cli",
              "-e", q(endpoint),
              "-a", q(account),
              "-c", q(profile),
              "-d", q(publisher),
              "%1",
            ].join(" ");
            const conf = JSON.parse(fs.readFileSync(path, "utf8"));
            conf.bundle = conf.bundle || {};
            conf.bundle.windows = {
              ...(conf.bundle.windows || {}),
              signCommand,
            };
            delete conf.bundle.windows.certificateThumbprint;
            fs.writeFileSync(path, JSON.stringify(conf, null, 2) + "\n");
            console.log("Wrote windows.signCommand for Azure Artifact Signing");
          '

      - name: Import Windows signing certificate (.pfx)
        if: matrix.os == 'win' && env.WINDOWS_SIGN_MODE == 'pfx'
        env:
          WIN_SIGN_CERTIFICATE: ${{ secrets.WIN_SIGN_CERTIFICATE_BASE64 }}
          WIN_SIGN_CERTIFICATE_PASSWORD: ${{ secrets.WIN_SIGN_CERTIFICATE_PASSWORD }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path certificate | Out-Null
          $bytes = [Convert]::FromBase64String($env:WIN_SIGN_CERTIFICATE)
          [IO.File]::WriteAllBytes("$pwd/certificate/certificate.pfx", $bytes)
          $secure = ConvertTo-SecureString -String $env:WIN_SIGN_CERTIFICATE_PASSWORD -Force -AsPlainText
          $cert = Import-PfxCertificate `
            -FilePath "$pwd/certificate/certificate.pfx" `
            -CertStoreLocation Cert:\CurrentUser\My `
            -Password $secure
          $thumb = $cert.Thumbprint
          Write-Host "Imported certificate thumbprint=$thumb"
          $env:THUMB = $thumb
          node -e @'
          const fs = require("fs");
          const path = "src-tauri/tauri.conf.json";
          const conf = JSON.parse(fs.readFileSync(path, "utf8"));
          conf.bundle = conf.bundle || {};
          conf.bundle.windows = {
            ...(conf.bundle.windows || {}),
            certificateThumbprint: process.env.THUMB,
            digestAlgorithm: "sha256",
            timestampUrl: "http://timestamp.digicert.com",
          };
          delete conf.bundle.windows.signCommand;
          fs.writeFileSync(path, JSON.stringify(conf, null, 2) + "\n");
          console.log("Wrote windows.certificateThumbprint=" + process.env.THUMB);
          '@

      - name: Build + upload to GitHub Release
        id: tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI: true
          # macOS — OpenFDE secret names → Tauri APPLE_* env
          # APPLE_SIGNING_IDENTITY comes from the cert (see Resolve step), not MAC_SIGN_IDENTITY
          APPLE_CERTIFICATE: ${{ matrix.os == 'mac' && secrets.MAC_SIGN_CERTIFICATE_BASE64 || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ matrix.os == 'mac' && secrets.MAC_SIGN_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ matrix.os == 'mac' && env.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_ID: ${{ matrix.os == 'mac' && secrets.MAC_APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ matrix.os == 'mac' && secrets.MAC_APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ matrix.os == 'mac' && secrets.MAC_APPLE_TEAM_ID || '' }}
          # Windows — same OpenFDE WIN_SIGN_* / AZURE_* names (artifact-signing-cli reads AZURE_*)
          WIN_SIGN_CERTIFICATE: ${{ matrix.os == 'win' && secrets.WIN_SIGN_CERTIFICATE_BASE64 || '' }}
          WIN_SIGN_CERTIFICATE_PASSWORD: ${{ matrix.os == 'win' && secrets.WIN_SIGN_CERTIFICATE_PASSWORD || '' }}
          AZURE_TENANT_ID: ${{ matrix.os == 'win' && secrets.AZURE_TENANT_ID || '' }}
          AZURE_CLIENT_ID: ${{ matrix.os == 'win' && secrets.AZURE_CLIENT_ID || '' }}
          AZURE_CLIENT_SECRET: ${{ matrix.os == 'win' && secrets.AZURE_CLIENT_SECRET || '' }}
          AZURE_SIGNING_ENDPOINT: ${{ matrix.os == 'win' && secrets.AZURE_SIGNING_ENDPOINT || '' }}
          AZURE_SIGNING_ACCOUNT_NAME: ${{ matrix.os == 'win' && secrets.AZURE_SIGNING_ACCOUNT_NAME || '' }}
          AZURE_SIGNING_CERTIFICATE_PROFILE: ${{ matrix.os == 'win' && secrets.AZURE_SIGNING_CERTIFICATE_PROFILE || '' }}
          AZURE_SIGNING_PUBLISHER_NAME: ${{ matrix.os == 'win' && secrets.AZURE_SIGNING_PUBLISHER_NAME || '' }}
        with:
          tagName: ${{ needs.meta.outputs.tag }}
          releaseName: DevTree ${{ needs.meta.outputs.tag }}
          releaseBody: |
            Download DevTree for your platform from the assets below.

            **Install options**
            - **GitHub Releases** — DMG / Windows installer (this page)
            - **npm CLI** — `npm i -g devtree-ai@latest` then `devtree install && devtree open`
            - **Homebrew (macOS)** — `brew tap Naughty-Otters/tap && brew install --cask devtree`

            **macOS (Apple Silicon)** — signed + notarized `aarch64` build
            **Windows** — signed `x86_64` installer (Azure Trusted Signing or `WIN_SIGN_*`)
          releaseDraft: ${{ needs.meta.outputs.draft == 'true' }}
          prerelease: ${{ needs.meta.outputs.prerelease == 'true' }}
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - name: Collect installers for Actions artifacts
        shell: bash
        env:
          ARTIFACT_PATHS: ${{ steps.tauri.outputs.artifactPaths }}
        run: |
          echo "tauri-action artifactPaths=$ARTIFACT_PATHS"
          node scripts/collect-release-artifacts.mjs
          ls -la release-artifacts || true

      - name: Upload build artifacts to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: DevTree-${{ needs.meta.outputs.tag }}-${{ matrix.target }}
          path: release-artifacts/
          if-no-files-found: warn
          retention-days: 90

      - name: Update Homebrew cask sha256 (from installer)
        if: matrix.platform == 'macos-latest'
        run: |
          node scripts/update-homebrew-cask.mjs \
            --search-root src-tauri/target \
            --allow-missing
          mkdir -p packaging-out
          if [ -f packaging/homebrew/devtree-cask-checksums.json ]; then
            cp packaging/homebrew/devtree.rb packaging-out/
            cp packaging/homebrew/devtree-cask-checksums.json packaging-out/
          else
            echo "No installer found for Homebrew cask; uploading placeholder note."
            echo "DMG/.app.tar.gz missing from this macOS build." > packaging-out/README.txt
          fi

      - name: Upload Homebrew cask packaging artifact
        if: matrix.platform == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: devtree-homebrew-cask
          path: packaging-out/
          retention-days: 14
          if-no-files-found: error

  npm-publish-cli:
    name: Publish devtree-ai to npm
    needs: [meta, release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Sync version, test, publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          node scripts/sync-cli-version.mjs
          npm --prefix packages/cli test
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "::warning::NPM_TOKEN not set — skipping npm publish for devtree-ai"
            (cd packages/cli && npm pack --dry-run)
            exit 0
          fi
          cd packages/cli
          npm publish --access public

  homebrew-tap:
    name: Update Homebrew tap cask
    needs: [meta, release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: devtree-homebrew-cask
          path: packaging-out

      - name: Push Casks/devtree.rb to Naughty-Otters/homebrew-tap
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          RELEASE_TAG: ${{ needs.meta.outputs.tag }}
        run: |
          set -euo pipefail
          if [ ! -f packaging-out/devtree.rb ]; then
            echo "::warning::No Homebrew cask Ruby file in packaging artifact — skipping tap update"
            ls -la packaging-out || true
            exit 0
          fi
          if [ -z "${HOMEBREW_TAP_TOKEN}" ]; then
            echo "::warning::HOMEBREW_TAP_TOKEN not set — skipping tap update (cask artifact still uploaded)"
            ls -la packaging-out
            exit 0
          fi
          git clone --depth 1 "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/Naughty-Otters/homebrew-tap.git" tap
          mkdir -p tap/Casks
          cp packaging-out/devtree.rb tap/Casks/devtree.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/devtree.rb
          if git diff --staged --quiet; then
            echo "Homebrew tap already up to date."
            exit 0
          fi
          git commit -m "chore: update devtree cask to ${RELEASE_TAG}"
          git push
