name: CI

# Builds stay on GitHub only (Actions artifacts). User-facing downloads come from GitHub Releases.
# On push to main/master, badges are published by publish-badges as teralexi-ci-bot[bot]
# (GitHub App token via CI-build env) — not github-actions[bot] / git-auto-commit.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-rust:
    name: Rust tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            crates/devtree-core
            src-tauri

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libglib2.0-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Run Rust unit tests
        run: cargo test --workspace

  test-typescript:
    name: TypeScript tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build WASM (required by some frontend modules)
        run: npm run build:wasm

      - name: Per-file unit test coverage gate
        run: npm run test:files

      - name: Check release version sync
        run: node scripts/apply-version.mjs --check

      - name: Run CLI package tests
        run: npm --prefix packages/cli test

      - name: Run TypeScript unit tests with coverage
        run: npm run test:coverage

      - name: Type-check frontend
        run: npx tsc --noEmit

      - name: Type-check unit tests
        run: npx tsc --noEmit -p tsconfig.test.json

      - name: Write version + coverage badge JSON
        run: node scripts/write-ci-badges.mjs

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage/coverage-summary.json
            coverage/index.html
            .github/badges/*.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload coverage summary for badge job
        uses: actions/upload-artifact@v4
        with:
          name: coverage-summary
          path: coverage/coverage-summary.json
          if-no-files-found: error
          retention-days: 7

  # Same pattern as OpenFDE / Teralexi: push as teralexi-ci-bot[bot] via GitHub App
  # installation token (not github-actions[bot] / GITHUB_TOKEN).
  # Secrets live in the "CI-build" environment (GIT_CI_BUILD_BOT_APP_ID + PRIVATE_ID).
  publish-badges:
    name: Publish README badges
    needs: [test-typescript]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: CI-build
    permissions:
      contents: read

    steps:
      - name: Normalize GitHub App private key
        id: app-key
        env:
          RAW_KEY: ${{ secrets.GIT_CI_BUILD_BOT_APP_PRIVATE_ID }}
        run: |
          set -euo pipefail
          if [ -z "${RAW_KEY}" ]; then
            echo "::error::CI-build secret GIT_CI_BUILD_BOT_APP_PRIVATE_ID is empty."
            echo "::error::Paste the full GitHub App private key .pem (including BEGIN/END lines)."
            exit 1
          fi

          key="$RAW_KEY"
          if [[ "$key" == \"*\" && "$key" == *\" ]]; then
            key="${key:1:-1}"
          fi
          key="${key//\\n/$'\n'}"
          key="${key//$'\r'/}"

          if ! printf '%s' "$key" | grep -q 'BEGIN.*PRIVATE KEY'; then
            decoded="$(printf '%s' "$key" | base64 -d 2>/dev/null || true)"
            if printf '%s' "$decoded" | grep -q 'BEGIN.*PRIVATE KEY'; then
              key="$decoded"
              key="${key//$'\r'/}"
            fi
          fi

          if ! printf '%s' "$key" | grep -q 'BEGIN.*PRIVATE KEY'; then
            echo "::error::GIT_CI_BUILD_BOT_APP_PRIVATE_ID is not a PEM private key."
            echo "::error::Use the .pem from GitHub App → Generate a private key."
            exit 1
          fi

          {
            echo "private-key<<PRIVATE_KEY_EOF"
            printf '%s\n' "$key"
            echo "PRIVATE_KEY_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Generate GitHub App token (teralexi-ci-bot)
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.GIT_CI_BUILD_BOT_APP_ID }}
          private-key: ${{ steps.app-key.outputs.private-key }}
          # Inherit all permissions granted on the installation (explicit
          # permission-* inputs can produce tokens that fail protected-branch push).

      - name: Require teralexi-ci-bot app
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          set -euo pipefail
          echo "Resolved app slug: ${APP_SLUG}"
          if [ "${APP_SLUG}" != "teralexi-ci-bot" ]; then
            echo "::error::Expected GitHub App slug 'teralexi-ci-bot', got '${APP_SLUG}'."
            echo "::error::Point CI-build secrets GIT_CI_BUILD_BOT_APP_ID / PRIVATE_ID at the teralexi-ci-bot app (same as OpenFDE)."
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      - name: Verify teralexi-ci-bot can push
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          INSTALLATION_ID: ${{ steps.app-token.outputs.installation-id }}
          APP_SLUG: teralexi-ci-bot
          HUSKY: "0"
        run: bash .github/scripts/verify-app-push.sh

      - name: Download coverage summary
        uses: actions/download-artifact@v4
        with:
          name: coverage-summary
          path: coverage

      - name: Write version + coverage badge JSON
        run: node scripts/write-ci-badges.mjs

      - name: Commit and push badges as teralexi-ci-bot[bot]
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          HUSKY: "0"
        run: |
          set -euo pipefail
          git config user.name "teralexi-ci-bot[bot]"
          git config user.email "teralexi-ci-bot[bot]@users.noreply.github.com"
          git add .github/badges/*.json
          if git diff --staged --quiet; then
            echo "Badges already up to date."
            exit 0
          fi
          git commit --no-verify -m "chore: update CI status badges [skip ci]"
          git push --no-verify "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_REF_NAME}"

  build:
    name: Build (${{ matrix.platform }})
    needs: [test-rust, test-typescript]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: msi,nsis
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libglib2.0-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install Rust WASM target
        run: rustup target add wasm32-unknown-unknown

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app (unsigned)
        run: npm run tauri build -- --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --no-sign
        env:
          CI: true

      - name: Collect installers for Actions artifacts
        shell: bash
        run: node scripts/collect-release-artifacts.mjs

      - name: Upload build artifacts to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: DevTree-${{ matrix.target }}
          path: release-artifacts/
          if-no-files-found: warn
          retention-days: 14
