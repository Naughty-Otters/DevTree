name: CI

# Builds stay on GitHub only (Actions artifacts). User-facing downloads come from GitHub Releases.
# On push to main/master, version + coverage badge JSON is published for the README.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-rust:
    name: Rust tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            crates/devtree-core
            src-tauri

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libglib2.0-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Run Rust unit tests
        run: cargo test --workspace

  test-typescript:
    name: TypeScript tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build WASM (required by some frontend modules)
        run: npm run build:wasm

      - name: Per-file unit test coverage gate
        run: npm run test:files

      - name: Check release version sync
        run: node scripts/sync-cli-version.mjs --check

      - name: Run CLI package tests
        run: npm --prefix packages/cli test

      - name: Run TypeScript unit tests with coverage
        run: npm run test:coverage

      - name: Type-check frontend
        run: npx tsc --noEmit

      - name: Type-check unit tests
        run: npx tsc --noEmit -p tsconfig.test.json

      - name: Write version + coverage badge JSON
        run: node scripts/write-ci-badges.mjs

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage/coverage-summary.json
            coverage/index.html
            .github/badges/*.json
          if-no-files-found: error
          retention-days: 14

      - name: Publish README badges on main
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update CI status badges [skip ci]"
          file_pattern: ".github/badges/*.json"
        env:
          # Badge JSON only — skip husky pre-commit (test:all / cargo test).
          # This job has no GTK/glib deps; Rust tests already ran in test-rust.
          HUSKY: "0"

  build:
    name: Build (${{ matrix.platform }})
    needs: [test-rust, test-typescript]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: msi,nsis
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libglib2.0-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install Rust WASM target
        run: rustup target add wasm32-unknown-unknown

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app (unsigned)
        run: npm run tauri build -- --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --no-sign
        env:
          CI: true

      - name: Collect installers for Actions artifacts
        shell: bash
        run: node scripts/collect-release-artifacts.mjs

      - name: Upload build artifacts to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: DevTree-${{ matrix.target }}
          path: release-artifacts/
          if-no-files-found: warn
          retention-days: 14
